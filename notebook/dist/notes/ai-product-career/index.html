<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="六边形的学习笔记，持续记录分享会观点、能力框架与下一步行动。本期主题为从应用统计学到 AI 产品经理。">
  <meta name="theme-color" content="#f7f6f2">
  <title>AI 产品与求职笔记 · 六边形的学习笔记</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./notes.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>
  <button id="menuBackdrop" class="menu-backdrop" aria-label="关闭目录" hidden></button>
  <aside id="sidebar" class="sidebar" aria-label="笔记目录">
    <a href="../../" id="homeLink" class="brand" aria-label="返回六边形首页">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M9 8h10l4 4v13H9V8Z" stroke="currentColor" stroke-width="1.6"/><path d="M18 8v5h5M12 17h8M12 21h5" stroke="currentColor" stroke-width="1.6"/></svg></span>
      <span><strong>六边形的学习笔记</strong><small>LEARN · REFLECT · BUILD</small></span>
      <span class="brand-dot" aria-hidden="true"></span>
    </a>
    <div class="search-field">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.7"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <label for="searchInput" class="sr-only">搜索本篇笔记</label>
      <input id="searchInput" type="search" placeholder="搜索本篇内容…" autocomplete="off" spellcheck="false" enterkeyhint="search">
      <kbd aria-hidden="true">/</kbd>
    </div>
    <div class="sidebar-label"><span>本期笔记</span><span id="chapterCount"></span></div>
    <nav id="chapterNav" class="chapter-nav" aria-label="章节"></nav>
    <div class="sidebar-bottom">
      <div class="font-setting"><span>阅读字号</span><div class="font-buttons" role="group" aria-label="调整阅读字号"><button id="fontDecrease" type="button" aria-label="缩小字号">A<span>−</span></button><span id="fontValue">标准</span><button id="fontIncrease" type="button" aria-label="放大字号">A<span>+</span></button></div></div>
    </div>
  </aside>

  <div class="page-shell">
    <header class="topbar">
      <div class="topbar-start">
        <button id="menuToggle" class="icon-button mobile-menu" type="button" aria-label="打开目录" aria-controls="sidebar" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
        <span class="breadcrumb">六边形的学习笔记<span>/</span><strong>求职记录</strong></span>
      </div>
      <div class="topbar-actions">
        <button id="printButton" class="icon-button print-button" type="button" aria-label="打印笔记"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 8V3h10v5M7 17H4V9h16v8h-3M7 14h10v7H7v-7Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M17 11h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        <button id="exportButton" class="button button-export" type="button"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 2v10m-3-3 3 3 3-3M3 12v5h14v-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>导出笔记</span></button>
      </div>
    </header>

    <main id="main" class="main" tabindex="-1">
      <section class="notebook-heading" aria-labelledby="notebookTitle">
        <h1 id="notebookTitle">AI 产品与求职笔记</h1>
        <p id="notebookSubtitle" class="notebook-subtitle">从应用统计学到 AI 产品经理</p>
        <div class="notebook-meta"><span class="meta-type"><span aria-hidden="true"></span>学习笔记</span><span class="meta-divider" aria-hidden="true"></span><span id="updatedLabel"></span><span class="meta-divider" aria-hidden="true"></span><span id="readingTime"></span></div>
      </section>

      <div class="view-bar"><div class="view-tabs" role="tablist" aria-label="笔记视图"><button id="tab-notes" class="view-tab active" type="button" role="tab" aria-selected="true" aria-controls="view-notes" data-view="notes">分享会笔记<span id="sectionBadge"></span></button><button id="tab-actions" class="view-tab" type="button" role="tab" aria-selected="false" aria-controls="view-actions" data-view="actions">行动清单<span id="actionBadge"></span></button><button id="tab-updates" class="view-tab" type="button" role="tab" aria-selected="false" aria-controls="view-updates" data-view="updates">更新记录</button></div></div>

      <section id="searchResults" class="search-results" aria-label="搜索结果" hidden><div class="search-heading"><div><p class="section-kicker">SEARCH</p><h2 id="searchTitle">搜索结果</h2></div><button id="clearSearch" class="text-button" type="button">清除搜索 <span aria-hidden="true">×</span></button></div><p id="searchSummary" class="muted" aria-live="polite"></p><div id="resultList"></div></section>

      <div id="view-notes" class="view-panel" role="tabpanel" aria-labelledby="tab-notes">
        <p id="notebookDescription" hidden></p>
        <div id="categoryOverview" class="category-overview" hidden aria-label="笔记主题"></div>
        <div id="notesContent" class="notes-content"></div>
        <div class="chapter-ending"><button id="goToActions" type="button" class="text-button">打开行动清单 <span aria-hidden="true">↗</span></button></div>
      </div>

      <section id="view-actions" class="view-panel action-view" role="tabpanel" aria-labelledby="tab-actions" hidden>
        <div class="view-intro"><h2>行动清单</h2></div>
        <div class="progress-area"><div class="progress-label"><strong id="progressText">已完成 0 项</strong><span id="progressPercentage">0%</span></div><div id="actionProgress" class="progress-track" role="progressbar" aria-label="行动完成进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progressFill"></span></div><div class="progress-note"><span>勾选状态仅保存在当前浏览器。</span><button id="resetActions" class="text-button" type="button">重置勾选</button></div></div>
        <div id="actionList" class="action-list"></div>
      </section>

      <section id="view-updates" class="view-panel updates-view" role="tabpanel" aria-labelledby="tab-updates" hidden>
        <div class="view-intro"><h2>更新记录</h2></div><ol id="updateList" class="update-list"></ol>
        
      </section>

      <footer class="page-footer"><span>六边形的学习笔记</span><a href="#main" id="backToTop">回到顶部 ↑</a></footer>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
